name: selftest

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run 23-check smoke selftest
        run: python3 评测引擎.py selftest
      - name: Run end-to-end demo
        run: python3 评测引擎.py demo
      - name: MCP shell import check
        run: |
          pip install "mcp>=1.0,<2"
          python3 -c "from mcp_server import mcp; import asyncio; print('tools:', len(asyncio.run(mcp.list_tools())))"
