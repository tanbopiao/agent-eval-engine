[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval-engine"
version = "0.2.0"
description = "Verifiable agent evaluation engine: deterministic scoring, hash-chain audit trail, selftest CLI, MCP server shell over stdio."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "tanbopiao" }]
keywords = ["mcp", "agent", "evaluation", "benchmark", "audit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["mcp>=1.0,<2"]

[project.urls]
Homepage = "https://github.com/tanbopiao/agent-eval-engine"
Repository = "https://github.com/tanbopiao/agent-eval-engine"
Issues = "https://github.com/tanbopiao/agent-eval-engine/issues"

[project.scripts]
agent-eval-engine = "mcp_server:main"

[tool.setuptools]
py-modules = ["mcp_server", "评测引擎"]
